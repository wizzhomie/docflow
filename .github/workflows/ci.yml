# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ukr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pre-commit pytest

      - name: Run ruff
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy --config-file mypy.ini .

      - name: Run tests
        run: python3 tests/run_eval.py

      - name: Run split evaluation
        run: python3 tests/run_eval_split.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docflow:test .

      - name: Test Docker image starts
        run: |
          docker run -d --name docflow-test -p 8000:8000 docflow:test
          sleep 10
          curl -f http://localhost:8000/api/health
          docker stop docflow-test