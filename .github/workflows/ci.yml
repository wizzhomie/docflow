# .github/workflows/ci.yml
name: CI

# Every push to main is checked, and a pull request is checked before it lands:
# the demo server deploys itself from main (deploy/release.sh in the operator
# repo), so a red main is a red deployment. `workflow_dispatch` stays for a
# deliberate re-run.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    # The tenancy and sign-in suites need a real database: they are the proof of
    # the row-level policies, and a run without one silently skips them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The role is created below without SUPERUSER and without BYPASSRLS: a
      # superuser would satisfy every policy without the policy doing anything.
      DOCFLOW_PG_DSN: "host=127.0.0.1 port=5432 dbname=docflow_dev user=docflow password=docflow"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ukr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE docflow LOGIN PASSWORD 'docflow' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d docflow_dev -v ON_ERROR_STOP=1 \
            -c "GRANT ALL ON SCHEMA public TO docflow;"
          # The same migrations the server runs, through the same tool, so CI
          # tests the path a deploy actually takes.
          python3 tools/migrate.py
          python3 tools/migrate.py --status
          # If this ever prints t, the isolation suite has stopped testing isolation.
          PGPASSWORD=docflow psql -h 127.0.0.1 -U docflow -d docflow_dev -tAc \
            "select rolsuper, rolbypassrls from pg_roles where rolname = current_user" \
            | grep -q 'f|f'

      - name: Lint
        run: ruff check .

      - name: Parser regression
        run: |
          python3 tests/run_eval.py
          python3 tests/run_eval_split.py

      - name: Tests, with the coverage gate
        run: pytest -q --cov --cov-fail-under=71

  docker-build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docflow:test .

      - name: Test Docker image starts
        run: |
          docker run -d --name docflow-test -p 8000:8000 docflow:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs docflow-test
          exit 1
