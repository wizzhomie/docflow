# .github/workflows/ci.yml
name: CI

# Runs on demand and on pull requests only. Pushes are batched, so the owner is
# not notified by a check run every time a small change lands.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ukr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parser regression
        run: |
          python3 tests/run_eval.py
          python3 tests/run_eval_split.py

      - name: Deterministic test suites
        run: |
          for suite in tests/test_*.py; do
            echo "== $suite"
            python3 "$suite"
          done

  docker-build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docflow:test .

      - name: Test Docker image starts
        run: |
          docker run -d --name docflow-test -p 8000:8000 docflow:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs docflow-test
          exit 1
