[project]
name = "docflow"
version = "0.1.0"
description = "Ukrainian invoice parser with CRM integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "pypdf==7.0.1",
    "requests==2.32.3",
    "weasyprint==65.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM"
]
ignore = ["E501", "B008"]
exclude = [".git", "__pycache__", ".venv", "venv", "data", "samples", "templates"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["profiles", "extractor", "validation", "uspacy", "app", "tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true