[project]
name = "docflow"
version = "0.1.0"
description = "Document intake for Ukrainian invoices and acts: recognition, human review, routing and CRM delivery"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["document-intake", "ocr", "invoices", "fastapi", "uspacy", "bitrix24"]
classifiers = [
    "Private project prototype",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "pypdf==7.0.1",
    "requests==2.32.3",
    "weasyprint==70.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", "__pycache__", ".venv", "venv", "data", "samples", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["profiles", "extractor", "validation", "uspacy", "app", "mailbox", "routing", "connectors", "webutil", "settings", "docstore", "crm", "impact", "intake", "pgapi", "routes", "tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -m pytest` puts the working directory on sys.path, the `pytest` script does
# not; the suites import modules from the repository root (`db`, `settings`), and CI
# calls the script. Name the path instead of depending on how pytest was started.
pythonpath = ["."]
# One process, one report: the suites are plain functions named `test_*`, so
# pytest collects everything the per-file loop used to run.
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", "tests/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true
