# .pre-commit-config.yaml
# Only repository hygiene. Linting and type checking are not configured yet:
# the project has no ruff/mypy settings, so those hooks are intentionally absent.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
