<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="560" viewBox="0 0 1620 560" role="img" aria-label="Процесс после автоматизации" font-family="'Carlito','DejaVu Sans',system-ui,sans-serif"><rect width="1620" height="560" fill="#f7f8fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-crm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><text x="40" y="52" font-size="25" font-weight="700" fill="#111827">Процесс после автоматизации</text><text x="40" y="78" font-size="13.5" fill="#6b7280">DocFlow снимает интерпретацию, валидацию и передачу в CRM; человек решает только спорное</text><rect x="1494.0" y="40" width="10" height="10" rx="3" fill="#dc2626"/><text x="1510.0" y="49.5" font-size="12.5" fill="#6b7280">исключение</text><rect x="1436.4" y="40" width="10" height="10" rx="3" fill="#10b981"/><text x="1452.4" y="49.5" font-size="12.5" fill="#6b7280">CRM</text><rect x="1350.0" y="40" width="10" height="10" rx="3" fill="#f59e0b"/><text x="1366.0" y="49.5" font-size="12.5" fill="#6b7280">человек</text><rect x="1263.6" y="40" width="10" height="10" rx="3" fill="#2563eb"/><text x="1279.6" y="49.5" font-size="12.5" fill="#6b7280">система</text><rect x="30" y="120" width="240" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="30" y="120" width="5" height="96" rx="2.5" fill="#2563eb"/><text x="50" y="147" font-size="15" font-weight="600" fill="#111827">Приём документа</text><text x="50" y="169" font-size="12.5" fill="#6b7280">upload, API,</text><text x="50" y="186" font-size="12.5" fill="#6b7280">почта</text><rect x="292" y="120" width="240" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="292" y="120" width="5" height="96" rx="2.5" fill="#2563eb"/><text x="312" y="147" font-size="15" font-weight="600" fill="#111827">Извлечение текста</text><text x="312" y="169" font-size="12.5" fill="#6b7280">PDF, скан,</text><text x="312" y="186" font-size="12.5" fill="#6b7280">OCR ukr+eng</text><rect x="554" y="120" width="240" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="554" y="120" width="5" height="96" rx="2.5" fill="#2563eb"/><text x="574" y="147" font-size="15" font-weight="600" fill="#111827">Интерпретация</text><text x="574" y="169" font-size="12.5" fill="#6b7280">поля счёта и</text><text x="574" y="186" font-size="12.5" fill="#6b7280">позиции</text><rect x="816" y="120" width="240" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="816" y="120" width="5" height="96" rx="2.5" fill="#2563eb"/><text x="836" y="147" font-size="15" font-weight="600" fill="#111827">Валидация</text><text x="836" y="169" font-size="12.5" fill="#6b7280">инварианты,</text><text x="836" y="186" font-size="12.5" fill="#6b7280">риск-флаг</text><rect x="1078" y="120" width="240" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1078" y="120" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="1098" y="147" font-size="15" font-weight="600" fill="#111827">Ревью человеком</text><text x="1098" y="169" font-size="12.5" fill="#6b7280">только спорное,</text><text x="1098" y="186" font-size="12.5" fill="#6b7280">правки и confirm</text><rect x="1340" y="120" width="240" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1340" y="120" width="5" height="96" rx="2.5" fill="#10b981"/><text x="1360" y="147" font-size="15" font-weight="600" fill="#111827">Сделка в CRM</text><text x="1360" y="169" font-size="12.5" fill="#6b7280">сумма, компания,</text><text x="1360" y="186" font-size="12.5" fill="#6b7280">комментарий</text><path d="M 270 168 L 292 168" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 532 168 L 554 168" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 794 168 L 816 168" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1056 168 L 1078 168" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1318 168 L 1340 168" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="300" width="260" height="92" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><rect x="30" y="300" width="5" height="92" rx="2.5" fill="#dc2626"/><text x="50" y="327" font-size="15" font-weight="600" fill="#111827">Текст не извлечён</text><text x="50" y="349" font-size="12.5" fill="#6b7280">скан низкого качества →</text><text x="50" y="366" font-size="12.5" fill="#6b7280">ручной ввод, не тишина</text><path d="M 412 216 L 412 254 L 160 254 L 160 298" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="560" y="300" width="260" height="92" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><rect x="560" y="300" width="5" height="92" rx="2.5" fill="#dc2626"/><text x="580" y="327" font-size="15" font-weight="600" fill="#111827">Инвариант провален</text><text x="580" y="349" font-size="12.5" fill="#6b7280">сумма, НДС, ЄДРПОУ, items →</text><text x="580" y="366" font-size="12.5" fill="#6b7280">приоритетное ревью</text><path d="M 936 216 L 936 254 L 690 254 L 690 298" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="1090" y="300" width="260" height="92" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><rect x="1090" y="300" width="5" height="92" rx="2.5" fill="#dc2626"/><text x="1110" y="327" font-size="15" font-weight="600" fill="#111827">Дубль по номеру + ЄДРПОУ</text><text x="1110" y="349" font-size="12.5" fill="#6b7280">сделка не создаётся,</text><text x="1110" y="366" font-size="12.5" fill="#6b7280">показывается найденная</text><path d="M 1460 216 L 1460 254 L 1220 254 L 1220 298" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><text x="40" y="446" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="1.2">ИЗМЕРЕНИЯ</text><rect x="40.0" y="462" width="125.6" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/><text x="51.0" y="481.5" font-size="12" fill="#3730a3">auto-pass rate</text><rect x="175.6" y="462" width="155.2" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/><text x="186.6" y="481.5" font-size="12" fill="#3730a3">median review time</text><rect x="340.8" y="462" width="170.0" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/><text x="351.8" y="481.5" font-size="12" fill="#3730a3">corrections by field</text><rect x="520.8" y="462" width="155.2" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/><text x="531.8" y="481.5" font-size="12" fill="#3730a3">duplicates blocked</text><rect x="686.0" y="462" width="110.8" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/><text x="697.0" y="481.5" font-size="12" fill="#3730a3">CRM failures</text><text x="40" y="528" font-size="13" fill="#6b7280">Правило: машина никогда не отправляет в CRM значение, в котором не уверена — спорное уходит человеку, а не в тишину.</text></svg>