<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="470" viewBox="0 0 1560 470" role="img" aria-label="Процесс до автоматизации" font-family="'Carlito','DejaVu Sans',system-ui,sans-serif"><rect width="1560" height="470" fill="#f7f8fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-crm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><text x="40" y="52" font-size="25" font-weight="700" fill="#111827">Процесс до автоматизации</text><text x="40" y="78" font-size="13.5" fill="#6b7280">Ручной контур: счёт приходит в почту, попадает в CRM руками</text><rect x="1477.2" y="40" width="10" height="10" rx="3" fill="#dc2626"/><text x="1493.2" y="49.5" font-size="12.5" fill="#6b7280">риск</text><rect x="1390.8" y="40" width="10" height="10" rx="3" fill="#f59e0b"/><text x="1406.8" y="49.5" font-size="12.5" fill="#6b7280">человек</text><rect x="40" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="40" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="60" y="157" font-size="15" font-weight="600" fill="#111827">Получение счёта</text><text x="60" y="179" font-size="12.5" fill="#6b7280">email, мессенджер,</text><text x="60" y="196" font-size="12.5" fill="#6b7280">бумага, повторные</text><rect x="330" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="330" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="350" y="157" font-size="15" font-weight="600" fill="#111827">Ручной ввод в CRM</text><text x="350" y="179" font-size="12.5" fill="#6b7280">номер, дата, поставщик,</text><text x="350" y="196" font-size="12.5" fill="#6b7280">сумма, ЄДРПОУ</text><rect x="620" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="620" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="640" y="157" font-size="15" font-weight="600" fill="#111827">Проверка бухгалтером</text><text x="640" y="179" font-size="12.5" fill="#6b7280">сумма, НДС,</text><text x="640" y="196" font-size="12.5" fill="#6b7280">реквизиты</text><rect x="910" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="910" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="930" y="157" font-size="15" font-weight="600" fill="#111827">Согласование оплаты</text><text x="930" y="179" font-size="12.5" fill="#6b7280">руководитель,</text><text x="930" y="196" font-size="12.5" fill="#6b7280">переписка</text><rect x="1200" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1200" y="130" width="5" height="96" rx="2.5" fill="#10b981"/><text x="1220" y="157" font-size="15" font-weight="600" fill="#111827">Оплата и проводка</text><text x="1220" y="179" font-size="12.5" fill="#6b7280">1С / банк</text><text x="1220" y="196" font-size="12.5" fill="#6b7280">отдельным шагом</text><path d="M 300 178 L 330 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 590 178 L 620 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 880 178 L 910 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1170 178 L 1200 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="58" y="298" font-size="13" font-weight="600" fill="#dc2626">Ошибки в сумме и ЄДРПОУ</text><text x="58" y="319" font-size="12" fill="#b91c1c">вводятся руками, проверяются глазами</text><path d="M 170 226 L 170 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="330" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="348" y="298" font-size="13" font-weight="600" fill="#dc2626">Потерянные счета</text><text x="348" y="319" font-size="12" fill="#b91c1c">нет единого реестра, дубли не видны</text><path d="M 460 226 L 460 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="620" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="638" y="298" font-size="13" font-weight="600" fill="#dc2626">Дубли сделок</text><text x="638" y="319" font-size="12" fill="#b91c1c">повторная отправка создаёт вторую</text><path d="M 750 226 L 750 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="910" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="928" y="298" font-size="13" font-weight="600" fill="#dc2626">Нет истории</text><text x="928" y="319" font-size="12" fill="#b91c1c">кто что менял и когда — неизвестно</text><path d="M 1040 226 L 1040 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><text x="40" y="400" font-size="13" fill="#6b7280">Один документ = 3–10 минут ручной работы, качество зависит от внимания человека. Данные для CRM вводятся вручную и не сверяются машиной.</text><text x="40" y="424" font-size="12" fill="#9ca3af">Схема показывает текущий процесс, а не дефекты конкретного исполнителя.</text></svg>