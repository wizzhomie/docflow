<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="470" viewBox="0 0 1560 470" role="img" aria-label="Process before automation" font-family="'Carlito','DejaVu Sans',system-ui,sans-serif"><rect width="1560" height="470" fill="#f7f8fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-crm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><text x="40" y="52" font-size="25" font-weight="700" fill="#111827">Process before automation</text><text x="40" y="78" font-size="13.5" fill="#6b7280">Manual loop: the invoice arrives by e-mail and is typed into the CRM by hand</text><rect x="1477.2" y="40" width="10" height="10" rx="3" fill="#dc2626"/><text x="1493.2" y="49.5" font-size="12.5" fill="#6b7280">risk</text><rect x="1405.2" y="40" width="10" height="10" rx="3" fill="#f59e0b"/><text x="1421.2" y="49.5" font-size="12.5" fill="#6b7280">human</text><rect x="40" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="40" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="60" y="157" font-size="15" font-weight="600" fill="#111827">Invoice arrives</text><text x="60" y="179" font-size="12.5" fill="#6b7280">e-mail, messenger,</text><text x="60" y="196" font-size="12.5" fill="#6b7280">paper, resends</text><rect x="330" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="330" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="350" y="157" font-size="15" font-weight="600" fill="#111827">Manual CRM entry</text><text x="350" y="179" font-size="12.5" fill="#6b7280">number, date, supplier,</text><text x="350" y="196" font-size="12.5" fill="#6b7280">amount, tax ID</text><rect x="620" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="620" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="640" y="157" font-size="15" font-weight="600" fill="#111827">Accountant check</text><text x="640" y="179" font-size="12.5" fill="#6b7280">amount, VAT,</text><text x="640" y="196" font-size="12.5" fill="#6b7280">bank details</text><rect x="910" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="910" y="130" width="5" height="96" rx="2.5" fill="#f59e0b"/><text x="930" y="157" font-size="15" font-weight="600" fill="#111827">Payment approval</text><text x="930" y="179" font-size="12.5" fill="#6b7280">owner,</text><text x="930" y="196" font-size="12.5" fill="#6b7280">correspondence</text><rect x="1200" y="130" width="260" height="96" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1200" y="130" width="5" height="96" rx="2.5" fill="#10b981"/><text x="1220" y="157" font-size="15" font-weight="600" fill="#111827">Payment and posting</text><text x="1220" y="179" font-size="12.5" fill="#6b7280">1C / bank</text><text x="1220" y="196" font-size="12.5" fill="#6b7280">as a separate step</text><path d="M 300 178 L 330 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 590 178 L 620 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 880 178 L 910 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1170 178 L 1200 178" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="58" y="298" font-size="13" font-weight="600" fill="#dc2626">Amount and tax ID errors</text><text x="58" y="319" font-size="12" fill="#b91c1c">typed by hand, checked by eye</text><path d="M 170 226 L 170 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="330" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="348" y="298" font-size="13" font-weight="600" fill="#dc2626">Lost invoices</text><text x="348" y="319" font-size="12" fill="#b91c1c">no register, duplicates unseen</text><path d="M 460 226 L 460 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="620" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="638" y="298" font-size="13" font-weight="600" fill="#dc2626">Duplicate deals</text><text x="638" y="319" font-size="12" fill="#b91c1c">a resend creates a second one</text><path d="M 750 226 L 750 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><rect x="910" y="270" width="260" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="928" y="298" font-size="13" font-weight="600" fill="#dc2626">No history</text><text x="928" y="319" font-size="12" fill="#b91c1c">nobody knows who changed what</text><path d="M 1040 226 L 1040 268" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-risk)"/><text x="40" y="400" font-size="13" fill="#6b7280">One document = 3–10 minutes of manual work, and quality depends on how carefully the person reads. CRM data is typed by hand and never machine-checked.</text><text x="40" y="424" font-size="12" fill="#9ca3af">The map shows the current process, not the faults of one particular person.</text></svg>