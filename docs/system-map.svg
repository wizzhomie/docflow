<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="DocFlow: шлях документа" font-family="'Carlito','DejaVu Sans',system-ui,sans-serif"><rect width="1240" height="620" fill="#f7f8fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-crm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-crm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><rect x="40" y="120" width="260" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="40" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="60" y="147" font-size="15" font-weight="600" fill="#111827">Прийом</text><text x="60" y="169" font-size="12.5" fill="#6b7280">папка data/inbox</text><text x="60" y="186" font-size="12.5" fill="#6b7280">завантаження файлу</text><text x="60" y="203" font-size="12.5" fill="#6b7280">готовий сэмпл</text><rect x="340" y="120" width="290" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="340" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="360" y="147" font-size="15" font-weight="600" fill="#111827">Розпізнавання</text><text x="360" y="169" font-size="12.5" fill="#6b7280">текст або OCR для сканів</text><text x="360" y="186" font-size="12.5" fill="#6b7280">визначення типу документа</text><text x="360" y="203" font-size="12.5" fill="#6b7280">поля + оцінка впевненості</text><rect x="670" y="120" width="240" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="670" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="690" y="147" font-size="15" font-weight="600" fill="#111827">Формальна перевірка</text><text x="690" y="169" font-size="12.5" fill="#6b7280">суми, дати, ЄДРПОУ</text><text x="690" y="186" font-size="12.5" fill="#6b7280">email, телефон, IBAN</text><text x="690" y="203" font-size="12.5" fill="#6b7280">містить сигнали, не виправляє</text><rect x="950" y="120" width="250" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="950" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="970" y="147" font-size="15" font-weight="600" fill="#111827">Черга на перевірку</text><text x="970" y="169" font-size="12.5" fill="#6b7280">документ не зникає</text><text x="970" y="186" font-size="12.5" fill="#6b7280">видно кількість сигналів</text><text x="970" y="203" font-size="12.5" fill="#6b7280">відкривається одним кліком</text><path d="M 300 166 L 338 166" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 630 166 L 668 166" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 910 166 L 948 166" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="30" width="290" height="56" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><rect x="340" y="30" width="5" height="56" rx="2.5" fill="#6b7280"/><text x="360" y="57" font-size="15" font-weight="600" fill="#111827">Профіль типу документа</text><text x="360" y="79" font-size="12.5" fill="#6b7280">рахунок / акт: свої підказки та поля</text><path d="M 485 86 L 485 118" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="100" y="300" width="280" height="100" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="100" y="300" width="5" height="100" rx="2.5" fill="#f59e0b"/><text x="120" y="327" font-size="15" font-weight="600" fill="#111827">Людина у ревʼю</text><text x="120" y="349" font-size="12.5" fill="#6b7280">перевіряє та править поля</text><text x="120" y="366" font-size="12.5" fill="#6b7280">натискає Confirm</text><text x="120" y="383" font-size="12.5" fill="#6b7280">бачить карточку результату</text><rect x="470" y="300" width="300" height="100" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="470" y="300" width="5" height="100" rx="2.5" fill="#10b981"/><text x="490" y="327" font-size="15" font-weight="600" fill="#111827">Конектор CRM</text><text x="490" y="349" font-size="12.5" fill="#6b7280">Uspacy або Bitrix24</text><text x="490" y="366" font-size="12.5" fill="#6b7280">компанія + реквізити</text><text x="490" y="383" font-size="12.5" fill="#6b7280">контакт і сделка</text><rect x="860" y="300" width="250" height="100" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="860" y="300" width="5" height="100" rx="2.5" fill="#2563eb"/><text x="880" y="327" font-size="15" font-weight="600" fill="#111827">Історія та метрики</text><text x="880" y="349" font-size="12.5" fill="#6b7280">що підтверджено</text><text x="880" y="366" font-size="12.5" fill="#6b7280">скільки зекономлено</text><text x="880" y="383" font-size="12.5" fill="#6b7280">що правлять найчастіше</text><path d="M 1075 212 L 1075 260 L 240 260 L 240 298" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 380 350 L 468 350" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 770 350 L 858 350" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="440" width="300" height="76" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><rect x="470" y="440" width="5" height="76" rx="2.5" fill="#dc2626"/><text x="490" y="467" font-size="15" font-weight="600" fill="#111827">Захист від дублів</text><text x="490" y="489" font-size="12.5" fill="#6b7280">локальна історія</text><text x="490" y="506" font-size="12.5" fill="#6b7280">перевірка у самій CRM</text><path d="M 620 438 L 620 402" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="40" y="440" width="380" height="76" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><rect x="40" y="440" width="5" height="76" rx="2.5" fill="#6b7280"/><text x="60" y="467" font-size="15" font-weight="600" fill="#111827">Що робить система, а що людина</text><text x="60" y="489" font-size="12.5" fill="#6b7280">система читає й перевіряє формально</text><text x="60" y="506" font-size="12.5" fill="#6b7280">людина вирішує і несе відповідальність</text><text x="40" y="560" font-size="13" fill="#6b7280">Схема відповідає на питання: що трапляється з документом від прийому до сделки в CRM.</text><text x="40" y="582" font-size="13" fill="#6b7280">Сині блоки — крок системи, помаранчевий — крок людини, зелений — зовнішня CRM, червоний — запобіжник.</text></svg>