<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="DocFlow: the path of a document" font-family="'Carlito','DejaVu Sans',system-ui,sans-serif"><rect width="1240" height="620" fill="#f7f8fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-crm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-crm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><rect x="40" y="120" width="260" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="40" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="60" y="147" font-size="15" font-weight="600" fill="#111827">Intake</text><text x="60" y="169" font-size="12.5" fill="#6b7280">folder data/inbox</text><text x="60" y="186" font-size="12.5" fill="#6b7280">file upload</text><text x="60" y="203" font-size="12.5" fill="#6b7280">a sample document</text><rect x="340" y="120" width="290" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="340" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="360" y="147" font-size="15" font-weight="600" fill="#111827">Recognition</text><text x="360" y="169" font-size="12.5" fill="#6b7280">text or OCR for scans</text><text x="360" y="186" font-size="12.5" fill="#6b7280">document type detection</text><text x="360" y="203" font-size="12.5" fill="#6b7280">fields + confidence score</text><rect x="670" y="120" width="240" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="670" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="690" y="147" font-size="15" font-weight="600" fill="#111827">Formal validation</text><text x="690" y="169" font-size="12.5" fill="#6b7280">amounts, dates, tax ID</text><text x="690" y="186" font-size="12.5" fill="#6b7280">e-mail, phone, IBAN</text><text x="690" y="203" font-size="12.5" fill="#6b7280">reports signals, never fixes</text><rect x="950" y="120" width="250" height="92" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="950" y="120" width="5" height="92" rx="2.5" fill="#2563eb"/><text x="970" y="147" font-size="15" font-weight="600" fill="#111827">Review queue</text><text x="970" y="169" font-size="12.5" fill="#6b7280">the document never vanishes</text><text x="970" y="186" font-size="12.5" fill="#6b7280">signal count is visible</text><text x="970" y="203" font-size="12.5" fill="#6b7280">opens in one click</text><path d="M 300 166 L 338 166" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 630 166 L 668 166" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 910 166 L 948 166" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="30" width="290" height="56" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><rect x="340" y="30" width="5" height="56" rx="2.5" fill="#6b7280"/><text x="360" y="57" font-size="15" font-weight="600" fill="#111827">Document-type profile</text><text x="360" y="79" font-size="12.5" fill="#6b7280">invoice / act: own hints and fields</text><path d="M 485 86 L 485 118" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="100" y="300" width="280" height="100" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="100" y="300" width="5" height="100" rx="2.5" fill="#f59e0b"/><text x="120" y="327" font-size="15" font-weight="600" fill="#111827">Human in review</text><text x="120" y="349" font-size="12.5" fill="#6b7280">checks and edits fields</text><text x="120" y="366" font-size="12.5" fill="#6b7280">presses Confirm</text><text x="120" y="383" font-size="12.5" fill="#6b7280">sees the result card</text><rect x="470" y="300" width="300" height="100" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="470" y="300" width="5" height="100" rx="2.5" fill="#10b981"/><text x="490" y="327" font-size="15" font-weight="600" fill="#111827">CRM connector</text><text x="490" y="349" font-size="12.5" fill="#6b7280">Uspacy or Bitrix24</text><text x="490" y="366" font-size="12.5" fill="#6b7280">company + bank details</text><text x="490" y="383" font-size="12.5" fill="#6b7280">contact and deal</text><rect x="860" y="300" width="250" height="100" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="860" y="300" width="5" height="100" rx="2.5" fill="#2563eb"/><text x="880" y="327" font-size="15" font-weight="600" fill="#111827">History and metrics</text><text x="880" y="349" font-size="12.5" fill="#6b7280">what was confirmed</text><text x="880" y="366" font-size="12.5" fill="#6b7280">how much time was saved</text><text x="880" y="383" font-size="12.5" fill="#6b7280">what gets corrected most</text><path d="M 1075 212 L 1075 260 L 240 260 L 240 298" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 380 350 L 468 350" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><path d="M 770 350 L 858 350" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="440" width="300" height="76" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><rect x="470" y="440" width="5" height="76" rx="2.5" fill="#dc2626"/><text x="490" y="467" font-size="15" font-weight="600" fill="#111827">Duplicate protection</text><text x="490" y="489" font-size="12.5" fill="#6b7280">local history</text><text x="490" y="506" font-size="12.5" fill="#6b7280">a check inside the CRM itself</text><path d="M 620 438 L 620 402" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="40" y="440" width="380" height="76" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><rect x="40" y="440" width="5" height="76" rx="2.5" fill="#6b7280"/><text x="60" y="467" font-size="15" font-weight="600" fill="#111827">What the system does</text><text x="60" y="489" font-size="12.5" fill="#6b7280">the system reads and checks formally</text><text x="60" y="506" font-size="12.5" fill="#6b7280">the human decides and owns the result</text><text x="40" y="560" font-size="13" fill="#6b7280">The map answers one question: what happens to a document between intake and a deal in the CRM.</text><text x="40" y="582" font-size="13" fill="#6b7280">Blue blocks are system steps, orange is a human step, green is the external CRM, red is a safeguard.</text></svg>